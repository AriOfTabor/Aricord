name: Release
on:
    push:
        branches:
            - main

env:
    FORCE_COLOR: true
    REPO: AriOfTabor/Aricord
    USERNAME: GitHub-Actions

permissions:
    contents: write

jobs:
    Build:
        name: Build Aricord
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build web
              run: pnpm buildWebStandalone

            - name: Build
              run: pnpm buildStandalone

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateEquicordPluginJson dist/equicordplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp Equicord.user.{js,js.LEGAL.txt} release

                  # copy the plugin data jsons, the extension zips and the desktop/equibop asars
                  cp *.{json,zip,asar} release

                  # legacy un-asared files
                  cp desktop/* release
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map

            - name: Upload Aricord Stable
              if: ${{ vars.ACT != 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # The release title must end with the commit sha — the in-app
                  # updater compares it against its build hash to decide whether
                  # an update is needed.
                  gh release view latest || gh release create latest --title "Aricord $GITHUB_SHA" --notes "Automated build"
                  gh release edit latest --title "Aricord $GITHUB_SHA"
                  gh release upload latest --clobber dist/release/*
